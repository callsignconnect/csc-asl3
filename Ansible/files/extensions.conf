; [sip-phones]
; exten => 1001,1,Dial(PJSIP/${EXTEN},60,rT)
; exten => ${NODE},1,Ringing
; exten => ${NODE},n,Answer(3000)
; exten => ${NODE},n,Set(NODENUM=${CALLERID(number)})
; exten => ${NODE},n,Playback(extension)
; exten => ${NODE},n,SayDigits(${NODENUM})
; exten => ${NODE},n,Playback(rpt/connected)
; exten => ${NODE},n,Playback(rpt/node)
; exten => ${NODE},n,SayDigits(${EXTEN})
; exten => ${NODE},n,rpt(${EXTEN}|P)
; exten => ${NODE},n,Hangup

[from-webrtc]
; Match any alphanumeric callsign coming from the browser
exten => _[a-zA-Z0-9].,1,NoOp(Incoming HTML5 Transceiver Call to Node ${EXTEN})
exten => _[a-zA-Z0-9].,n,Answer()
exten => _[a-zA-Z0-9].,n,Set(COR=unmuted)
exten => _[a-zA-Z0-9].,n,Rpt(${EXTEN},P,${CALLERID(num)}/H5T)
exten => _[a-zA-Z0-9].,n,Hangup()

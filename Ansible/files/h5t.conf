Alias /h5t /var/www/h5t
<Directory /var/www/h5t>
 Options Indexes FollowSymLinks
 AllowOverride None
 Require all granted
</Directory>

# Proxy WebRTC WebSocket traffic down to Asterisk's internal WSS port
ProxyPass /h5t/ws ws://127.0.0.1:8088/ws
ProxyPassReverse /h5t/ws ws://127.0.0.1:8088/ws

# TODO is this the best way to talk to Python? It probably shouldn't be exposed
ProxyPass /h5t/api http://127.0.0.1:8000/h5t/api
ProxyPassReverse /h5t/api http://127.0.0.1:8000/h5t/api

